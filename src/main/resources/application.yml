spring:
  datasource:
    url: jdbc:mysql://localhost:3306/e-waste_management_system-Users?createDatabaseIfNotExist=true
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # CORS Configuration
  web:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true

  # Security Configuration (disable for development)
  security:
    user:
      name: admin
      password: password
      roles: USER

server:
  port: 8081

# Logging for debugging
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.icet.project: DEBUG